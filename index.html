<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enterprise Kanban & Markov Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .kanban-col { min-height: 500px; background-color: #f8f9fa; border-radius: 8px; border: 1px dashed #dee2e6; }
      .importance-high { border-left: 5px solid #dc3545 !important; }
      .importance-medium { border-left: 5px solid #ffc107 !important; }
      .importance-low { border-left: 5px solid #0d6efd !important; }
      .importance-none { border-left: 5px solid #6c757d !important; }
      .fs-7 { font-size: 0.75rem; }
    </style>
  </head>
  <body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm px-4">
      <span class="navbar-brand mb-0 h1 fw-bold">📈 KANBAN WORKSPACE & STOCHASTIC MATHEMATICS ENGINE</span>
      <div class="d-flex gap-2">
        <button id="btn-export" class="btn btn-sm btn-outline-light">📤 JSONエクスポート</button>
        <button id="btn-import-trigger" class="btn btn-sm btn-outline-light" onclick="document.getElementById('import-file').click()">📥 JSONインポート</button>
        <input type="file" id="import-file" class="d-none" accept=".json" />
      </div>
    </nav>

    <div class="container-fluid px-4">
      <div class="row g-4">
        
        <div class="col-xl-4 col-lg-5">
          
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-2 fw-bold text-secondary">📝 タスク & 工程登録</div>
            <div class="card-body">
              <form id="todo-form">
                <div class="row g-2 mb-2">
                  <div class="col-8">
                    <input id="todo-input" class="form-control form-control-sm" placeholder="メインタスク名..." required />
                  </div>
                  <div class="col-4">
                    <select id="todo-importance" class="form-select form-select-sm">
                      <option value="none">重要度: なし</option>
                      <option value="low">重要度: 低</option>
                      <option value="medium" selected>重要度: 中</option>
                      <option value="high">重要度: 高</option>
                    </select>
                  </div>
                </div>
                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <input type="datetime-local" id="todo-deadline" class="form-control form-control-sm" />
                  </div>
                  <div class="col-6">
                    <input type="url" id="todo-link" class="form-control form-control-sm" placeholder="URL (https://...)" />
                  </div>
                </div>
                <div class="mb-3">
                  <textarea id="todo-comment" class="form-control form-control-sm" rows="1" placeholder="メモ・詳細..."></textarea>
                </div>

                <div class="p-2 border rounded bg-light mb-3">
                  <small class="fw-bold d-block text-muted mb-1">🏁 サブ・マイルストーン工程追加</small>
                  <div class="row g-1 mb-1">
                    <div class="col-7"><input type="text" id="ms-title-input" class="form-control form-control-sm" placeholder="マイルストーン名..." /></div>
                    <div class="col-5">
                      <select id="ms-importance-input" class="form-select form-select-sm">
                        <option value="none">優先: なし</option>
                        <option value="low">優先: 低</option>
                        <option value="medium" selected>優先: 中</option>
                        <option value="high">優先: 高</option>
                      </select>
                    </div>
                  </div>
                  <div class="input-group input-group-sm">
                    <input type="datetime-local" id="ms-deadline-input" class="form-control" />
                    <button class="btn btn-success text-white fw-bold" type="button" id="add-milestone-btn">+</button>
                  </div>
                  <div id="milestone-queue" class="d-flex flex-wrap gap-1 mt-1"></div>
                </div>

                <button class="btn btn-primary btn-sm w-100 fw-bold" type="submit">🚀 ワークスペースへ追加</button>
              </form>
            </div>
          </div>

          <div class="card shadow-sm border-secondary mb-4">
            <div class="card-header bg-dark text-white py-2 d-flex justify-content-between align-items-center">
              <span class="fw-bold small">🧮 確率的マルコフ連鎖 & ネットワーク解析</span>
              <button id="btn-run-analytics" class="btn btn-xs btn-info py-0 px-2 font-monospace text-white style-sm" style="font-size:0.7rem;">解析実行</button>
            </div>
            <div class="card-body p-3" id="analytics-output">
              <p class="text-muted small text-center mb-0">「解析実行」ボタンをクリックすると、現在のタスク構造から確率行列とクリティカルパスの依存度を算出します。</p>
            </div>
          </div>

        </div>

        <div class="col-xl-8 col-lg-7">
          <div class="row g-2">
            
            <div class="col-md-3">
              <div class="p-2 card bg-light border-0 shadow-xs">
                <div class="fw-bold text-primary mb-2 d-flex justify-content-between align-items-center">
                  <span>📥 未着手 (Todo)</span>
                  <span class="badge bg-primary rounded-pill" id="badge-todo">0</span>
                </div>
                <div id="col-todo" class="kanban-col p-2 d-flex flex-column gap-2"></div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="p-2 card bg-light border-0 shadow-xs">
                <div class="fw-bold text-warning mb-2 d-flex justify-content-between align-items-center">
                  <span>⚡ 進行中 (Progress)</span>
                  <span class="badge bg-warning text-dark rounded-pill" id="badge-progress">0</span>
                </div>
                <div id="col-progress" class="kanban-col p-2 d-flex flex-column gap-2"></div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="p-2 card bg-light border-0 shadow-xs">
                <div class="fw-bold text-danger mb-2 d-flex justify-content-between align-items-center">
                  <span>🚨 期限超過 (Overdue)</span>
                  <span class="badge bg-danger rounded-pill" id="badge-overdue">0</span>
                </div>
                <div id="col-overdue" class="kanban-col p-2 d-flex flex-column gap-2"></div>
              </div>
            </div>

            <div class="col-md-3">
              <div class="p-2 card bg-light border-0 shadow-xs">
                <div class="fw-bold text-success mb-2 d-flex justify-content-between align-items-center">
                  <span>✅ 完了済 (Done)</span>
                  <span class="badge bg-success rounded-pill" id="badge-done">0</span>
                </div>
                <div id="col-done" class="kanban-col p-2 d-flex flex-column gap-2"></div>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
